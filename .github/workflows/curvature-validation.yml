name: verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deterministic tests
        run: python3 -m unittest discover -s tests -v

  openfoam:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, openfoam-v2412]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check configured OpenFOAM environment
        run: ': "${WM_PROJECT_DIR:?runner must preload OpenFOAM.com v2412}"'
      - name: Build runtime library
        run: wmake libso src/curvatureCorrectionModels
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: MRF topology and time-dependence regression
        run: tests/run_mrf_mapping_regression.sh
      - name: Transient material-derivative regression
        run: tests/run_material_derivative_regression.sh
